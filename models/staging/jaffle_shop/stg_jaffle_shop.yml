version: 2

models:
  - name: stg_jaffle_shop__customers
    description: one unique customer per row
    columns:
      - name: customer_id
        description: the primary key
        data_type: number
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: the customer's first name
        data_type: varchar

      - name: last_name
        description: the customer's last name
        data_type: varchar

  - name: stg_jaffle_shop__orders
    description: one unique order per row
    columns:
      - name: order_id
        data_type: number
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_type: num
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: order_date
        data_type: date

      - name: status
        description: '{{ doc("order_status") }}'
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', return_pending]

      - name: _etl_loaded_at
        data_type: timestamp_ntz